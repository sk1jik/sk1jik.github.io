<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DRIP — магазин одежды (демо)</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#101014;color:#F4F4F8;font:16px/1.5 Manrope,sans-serif}
.back{position:fixed;top:12px;left:12px;z-index:9;background:#D4FF3A;color:#101014;padding:8px 14px;border-radius:99px;font-size:14px;text-decoration:none;font-weight:700}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 22px 16px 190px;position:sticky;top:0;background:#101014ee;backdrop-filter:blur(8px);z-index:5;border-bottom:1px solid #26262e}
.logo{font:800 22px Unbounded}.cart{background:#26262e;border-radius:99px;padding:8px 16px;font-weight:700}.cart b{color:#D4FF3A}
.w{max-width:1040px;margin:0 auto;padding:0 22px}
.hero{padding:70px 0 40px}h1{font:800 clamp(38px,8vw,88px)/1 Unbounded;margin:0 0 16px}h1 span{color:#FF3D81}.hero p{color:#a0a0b0;max-width:28em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0}.chip{border:2px solid #3a3a46;background:none;color:#F4F4F8;padding:9px 18px;border-radius:99px;font:700 15px Manrope;cursor:pointer}.chip.on{background:#D4FF3A;border-color:#D4FF3A;color:#101014}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;padding-bottom:70px}
.p{background:#1a1a22;border-radius:22px;overflow:hidden;transition:transform .2s}.p:hover{transform:translateY(-5px)}
.img{height:190px;display:grid;place-items:center;font-size:76px}.inf{padding:16px}.inf b{display:block}.inf small{color:#8a8a9a}
.buy{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.buy span{font:800 17px Unbounded}.buy button{background:#FF3D81;border:0;color:#fff;border-radius:12px;padding:9px 14px;font:700 14px Manrope;cursor:pointer}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,90px);background:#D4FF3A;color:#101014;padding:12px 22px;border-radius:99px;font-weight:700;transition:transform .3s}#toast.on{transform:translate(-50%,0)}
footer{text-align:center;color:#6a6a7a;font-size:14px;padding:0 0 40px}
@media(max-width:620px){header{padding-left:22px;padding-top:56px}}
</style></head><body>
<a class="back" href="index.html">← Портфолио · демо</a>
<header><div class="logo">DRIP</div><div class="cart">Корзина: <b id="cnt">0</b></div></header>
<div class="w">
<section class="hero"><h1>Одевайся <span>громче</span></h1><p>Куртки, кроссовки и аксессуары на каждый день. Выберите категорию и добавляйте в корзину.</p>
<div class="chips" id="chips"></div></section>
<div class="grid" id="grid"></div>
</div>
<footer>Демо-страница · сделал Вадим</footer>
<div id="toast">Добавлено в корзину</div>
<script>
var P=[['Куртка Bomber','Куртки',7900,'🧥','#3a2a6e'],['Парка Storm','Куртки',11900,'🧥','#1d4d4a'],['Кроссовки Run','Кроссовки',8900,'👟','#6e2a4a'],['Кроссовки Street','Кроссовки',6900,'👟','#4a4a1d'],['Кепка Logo','Аксессуары',1900,'🧢','#2a4a6e'],['Рюкзак City','Аксессуары',3900,'🎒','#5a2a1d']];
var C=['Все','Куртки','Кроссовки','Аксессуары'],cur='Все',n=0;
function show(){document.getElementById('chips').innerHTML=C.map(function(c){return '<button class="chip'+(c===cur?' on':'')+'" data-c="'+c+'">'+c+'</button>'}).join('');
document.getElementById('grid').innerHTML=P.filter(function(p){return cur==='Все'||p[1]===cur}).map(function(p){return '<div class="p"><div class="img" style="background:'+p[4]+'">'+p[3]+'</div><div class="inf"><b>'+p[0]+'</b><small>'+p[1]+'</small><div class="buy"><span>'+p[2].toLocaleString('ru-RU')+' ₽</span><button data-b="1">В корзину</button></div></div></div>'}).join('')}
document.addEventListener('click',function(e){var t=e.target;if(t.dataset.c){cur=t.dataset.c;show()}if(t.dataset.b){n++;document.getElementById('cnt').textContent=n;var o=document.getElementById('toast');o.classList.add('on');setTimeout(function(){o.classList.remove('on')},1200)}});
show();
</script></body></html>
